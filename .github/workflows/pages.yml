# Publishes the web app (`nix build .#web`) to GitHub Pages whenever a
# release is published, or when started by hand from the Actions tab.
# Needs Settings > Pages > Source set to "GitHub Actions" once.
name: Web app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish the web app
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build .#web -L && cp -rL result site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
