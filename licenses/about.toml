# cargo-about configuration for THIRD_PARTY_NOTICES.txt (scripts/notices.sh).
#
# The licenses json-diff may ship. A dependency under any other license makes
# generation fail, so it is noticed before it is released.
accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# The platforms json-diff is built for.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]
# Only what ends up in the app.
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
