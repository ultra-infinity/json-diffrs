[package]
name = "json-diff-app"
version = "0.8.0"
edition = "2024"
description = "json-diff's app state, commands and PDF reports, shared by the desktop and web apps"
authors.workspace = true
license.workspace = true
repository.workspace = true
# Shipped as an app, not on crates.io (where the name is taken anyway).
publish = false

[dependencies]
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0.0"
semver = "1"
json-diff-core = { path = "../json-diff-core" }
schemars = "1"
krilla = { version = "0.8.2", default-features = false, features = ["simple-text"] }

[dev-dependencies]
tempfile = "3"
