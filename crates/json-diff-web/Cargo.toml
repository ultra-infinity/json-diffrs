[package]
name = "json-diff-web"
version = "0.9.0"
edition = "2024"
description = "json-diff in the browser: the app state compiled to WebAssembly"
authors.workspace = true
license.workspace = true
repository.workspace = true
# Shipped as an app, not on crates.io (where the name is taken anyway).
publish = false

[lib]
# cdylib: the .wasm module; rlib: for the tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
json-diff-app = { path = "../json-diff-app" }
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0.0"
# Must match the wasm-bindgen CLI exactly (wasm-bindgen-cli_0_2_121 in
# flake.nix).
wasm-bindgen = "=0.2.121"
