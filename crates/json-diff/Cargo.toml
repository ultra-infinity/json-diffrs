[package]
name = "json-diff"
version = "0.2.0"
edition = "2024"
description = "Side-by-side JSON diff with folder comparison and an AI assistant"
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0.0"
json-diff-core = { path = "../json-diff-core" }
rig = "0.44"
schemars = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

[dev-dependencies]
futures = "0.3"
rig = { version = "0.44", features = ["test-utils"] }
tempfile = "3"

[features]
# Serve the bundled frontend instead of the Vite dev server. Release builds
# (Nix, `cargo tauri build`) turn this on.
custom-protocol = ["tauri/custom-protocol"]
