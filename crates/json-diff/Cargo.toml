[package]
name = "json-diff"
version = "0.1.0"
edition = "2024"
description = "Side-by-side JSON diff with folder comparison and an AI assistant"
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0.0"
eframe = "0.34.3"
json-diff-core = { path = "../json-diff-core" }
egui_extras = { version = "0.34.3", features = ["syntect"] }
rig = "0.44"
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
egui-file-dialog = "=0.13.0"

[dev-dependencies]
futures = "0.3"
rig = { version = "0.44", features = ["test-utils"] }
tempfile = "3"
