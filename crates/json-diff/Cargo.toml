[package]
name = "json-diff"
version = "0.5.0"
edition = "2024"
description = "Side-by-side JSON diff with folder comparison and an AI assistant"
authors.workspace = true
license.workspace = true
repository.workspace = true
# Shipped as an app, not on crates.io (where the name is taken anyway).
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0.0"
semver = "1"
json-diff-core = { path = "../json-diff-core" }
rig = "0.44"
schemars = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
keyring = { version = "3.6.3", features = ["windows-native", "async-secret-service", "crypto-rust", "tokio"] }
krilla = { version = "0.8.2", default-features = false, features = ["simple-text"] }

[dev-dependencies]
futures = "0.3"
rig = { version = "0.44", features = ["test-utils"] }
tempfile = "3"

[features]
# Serve the bundled frontend instead of the Vite dev server. Release builds
# (Nix, `cargo tauri build`) turn this on.
custom-protocol = ["tauri/custom-protocol"]
